name: Update official sunrise notice

on:
  schedule:
    - cron: "45 8 * * *"
  push:
    paths:
      - ".github/workflows/update-sunrise.yml"
      - "tools/update_sunrise.py"
      - "sunrise-status.json"

permissions:
  contents: write

jobs:
  update-notice:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch official notice
        run: python tools/update_sunrise.py
      - name: Publish changed notice
        run: |
          if git diff --quiet -- sunrise-status.json; then
            echo "No notice changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add sunrise-status.json
          git commit -m "chore: update official sunrise notice"
          git push